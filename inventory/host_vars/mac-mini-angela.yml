---
# Real values in inventory-private/host_vars/mac-mini-angela.yml
# =============================================================================
# Mac Mini — Angela (Australia, Supporting Potential)
# =============================================================================
# Hardware: Mac mini Mac18,5, Apple M6, 24 GB, macOS 27.0 (audited 2026-10-26)
# Groups: workstation + client. NOT creator, NOT david, NOT thailand (so no tailscale role).
# Tailscale: member of David's tailnet as `angela-mini`; she has no grant, so she
#            reaches none of David's machines. Connect over Tailscale only.
# Status: discovery.yml run 2026-10-27 (report in gitignored discovery_output/).
#         Not provisioned yet.
#
# How to run (decided 2026-10-27):
#   ANSIBLE_BECOME_ASK_PASS=False ansible-playbook site.yml --limit mac-mini-angela \
#     --skip-tags macos,dock,syncthing
#   - macos/dock skipped: she's new to macOS; David's defaults (dark mode, scrolling,
#     key repeat) and the dock role's "remove all Dock items" would be a shock.
#   - syncthing skipped: it's for David's skills sync; she isn't part of that.
#   - No sudo needed: the only become tasks are in power/tailscale/transcription_worker,
#     and her groups exclude all three. So no passwordless sudo change on her Mac.
#   - Already present by hand: Homebrew, git (CLT), gh, Claude Code (native),
#     iTerm2, Claude desktop, Tailscale, Chrome. Casks use --adopt, so these are kept.
# =============================================================================

propagate_ssh_key: false

# Base casks minus 1Password (she uses Apple Passwords).
homebrew_casks:
  - claude

# Workstation casks trimmed to what she'll use: no slack, antigravity, ghostty,
# obsidian, hammerspoon, loom, ollama-app.
homebrew_casks_workstation:
  - google-chrome
  - whatsapp
  - visual-studio-code
  - iterm2

# Node for dsp/website. No Ruby or pyenv Python builds (she doesn't need them; uv covers Python).
rbenv_ruby_versions: []
pyenv_python_versions: []
nvm_node_versions:
  - "24.13.0"
nvm_global_packages:
  - yarn

homebrew_formulae_extra: []
homebrew_casks_extra: []
git_repos_extra: []    # Repos are cloned by David on request, not by Ansible.
