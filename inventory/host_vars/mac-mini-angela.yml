# Real values in inventory-private/host_vars/mac-mini-angela.yml
# =============================================================================
# Mac Mini — Angela (Australia, Supporting Potential)
# =============================================================================
# Hardware: Mac mini Mac18,5, Apple M6, 24 GB, macOS 27.0 (audited 2026-10-26)
# Groups: workstation + client. NOT creator, NOT david, NOT thailand (so no tailscale role).
# Tailscale: member of David's tailnet as `angela-mini`; she has no grant, so she
#            reaches none of David's machines. Connect over Tailscale only.
# Status: NOT provisioned yet. Run discovery.yml first, then decide below.
#
# Decisions before the first site.yml run (David):
#   - She's new to macOS. group_vars/all.yml macos_defaults (dark mode, natural
#     scrolling off, fast key repeat, hidden files, Dock auto-hide) would be a
#     shock: run with --skip-tags macos,dock, or override macos_defaults here.
#   - Workstation casks are a lot for her (antigravity, hammerspoon, ollama-app,
#     loom, ghostty, obsidian, slack). Trim before running.
#   - Remote runs need passwordless sudo on her Mac. Get her OK first.
#   - Already present (by hand, 2026-10-25/26): Homebrew, git (Command Line
#     Tools), gh, Claude Code (native), iTerm2, Claude desktop, Tailscale, Chrome.
# =============================================================================

propagate_ssh_key: false

homebrew_formulae_extra: []
homebrew_casks_extra: []
git_repos_extra: []    # Repos are cloned by David on request, not by Ansible.
