---
# =============================================================================
# Mac Mini M2 Pro (32 GB) — full peer + transcription worker (shop, Thailand)
# Groups: workstation + agent + david + thailand + transcription_worker
# =============================================================================
# Since 2026-10-03 the M2 gets the same setup as the M4 and Roamy (David:
# "treat m2 like m4 and roamy, stop thinking of it as headless"), plus the
# transcription_worker role (transcription-worker.yml).
# Thai language/keyboard/time zone: left alone for now (tw_remove_thai_settings stays false).
# =============================================================================

# OpenRig trial (2026-10-08): M2 only until David has tested it; then Jan's Mac,
# then Roamy/M4 (both already have it by hand). Pinned to the security-scanned build
# 2620dea8 (brains/security/scan-log.md). The npm update task never loops over
# nvm_global_packages_extra, so the pin is never bumped by upgrade_packages.
homebrew_formulae_extra:
  - herdr                  # terminal workspace for AI agents — OpenRig's viewer
nvm_global_packages_extra:
  - "@openrig/cli@0.6.6"
homebrew_casks_extra: []
git_repos_extra: []

# power role: 24/7, no overnight sleep window (measured 2026-10-03: the M4 already runs
# this way — sleep 0, no scheduled events). Always-on services / transcription jobs.
power_schedule_enabled: false
