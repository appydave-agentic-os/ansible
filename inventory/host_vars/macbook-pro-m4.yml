---
# =============================================================================
# MacBook Pro M4 — Field Machine / Ansible Control Node
# Groups: workstation + creator + thailand
# =============================================================================
# workstation group provides: Chrome, VSCode, iTerm, Ghostty, Docker, Alfred,
#                             Rectangle, Zoom, WhatsApp, Claude, Ollama, etc.
# creator group provides:     Ecamm Live, Elgato Stream Deck
# =============================================================================

# Machine-specific extras beyond what groups provide
homebrew_formulae_extra:   # captured from discovery 2026-10-03 (Roamy only)
  - imagemagick
  - exiftool
  - duti                   # Default-app associations from the CLI
homebrew_casks_extra: []
homebrew_casks_exclude:   # overrides david.yml's list: Roamy keeps Slack (2026-11-04)
  - obsidian
  - hammerspoon
git_repos_extra: []
install_dam_wrapper: true

# shell role (.zshrc): carried over from Roamy's hand-edited file, 2026-11-11.
# Only Roamy sets this; the M4 and M2 set it to "0" in ~/.claude/settings.json. David to decide if it stays.
shell_env_vars_host:
  CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"

