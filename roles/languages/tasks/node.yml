---
- name: Install Node.js versions via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p "$NVM_DIR"
    [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
    if ! nvm ls {{ item }} >/dev/null 2>&1; then
      nvm install {{ item }}
    fi
  args:
    executable: /bin/zsh
  register: node_install
  changed_when: "'Now using' in node_install.stdout or 'Now using' in node_install.stderr"
  loop: "{{ nvm_node_versions }}"

- name: Reinstall Node.js versions to pick up latest patch
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p "$NVM_DIR"
    [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
    nvm install {{ item }} --reinstall-packages-from={{ item }}
  args:
    executable: /bin/zsh
  register: node_upgrade
  changed_when: "'Now using' in node_upgrade.stdout or 'Now using' in node_upgrade.stderr"
  loop: "{{ nvm_node_versions }}"
  when: upgrade_packages | bool

- name: Set default Node.js version
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p "$NVM_DIR"
    [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
    nvm alias default {{ nvm_node_global }}
  args:
    executable: /bin/zsh
  changed_when: false
  when: nvm_node_global | length > 0

- name: Install global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p "$NVM_DIR"
    [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
    nvm use {{ nvm_node_global }}
    # First attempt — if EEXIST, remove conflicting symlinks and retry
    OUTPUT=$(npm install -g {{ item }} 2>&1) && echo "$OUTPUT" && exit 0
    CONFLICT=$(echo "$OUTPUT" | grep "File exists:" | head -1 | sed 's/.*File exists: //' | tr -d '[:space:]')
    if [ -n "$CONFLICT" ]; then
      rm -f "$CONFLICT"
      npm install -g {{ item }}
    else
      echo "$OUTPUT" >&2
      exit 1
    fi
  args:
    executable: /bin/zsh
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'added' in npm_install.stderr"
  loop: "{{ nvm_global_packages }}"

- name: Install Claude Code (native installer)
  ansible.builtin.shell: |
    if ! command -v claude >/dev/null 2>&1 || [[ "$(which claude)" != "$HOME/.local/bin/claude" ]]; then
      curl -fsSL https://claude.ai/install.sh | bash
    fi
  args:
    executable: /bin/zsh
  register: claude_install
  changed_when: "'Installed' in claude_install.stdout or 'installed' in claude_install.stdout"

- name: Update global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p "$NVM_DIR"
    [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
    nvm use {{ nvm_node_global }}
    npm update -g {{ item }}
  args:
    executable: /bin/zsh
  register: npm_update
  changed_when: "'updated' in npm_update.stdout or 'added' in npm_update.stdout"
  loop: "{{ nvm_global_packages }}"
  when: upgrade_packages | bool
