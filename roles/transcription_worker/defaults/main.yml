---
# =============================================================================
# transcription_worker — CrisperWhisper + FliTools on top of a normal peer (mac-mini-m2)
# =============================================================================
# Runs on top of the usual site.yml setup (the M2 is a full peer since 2026-10-03).
#   - FliTools: a normal git clone + npm ci (the M2 has GitHub access)
#   - CrisperWhisper: standard install — uv venv + pinned requirements (incl. the
#     nyrahealth transformers fork from GitHub); the ~3.1 GB model downloads from
#     Hugging Face on first run. Reproducible without the M4.
# =============================================================================

# --- Worker paths ------------------------------------------------------------
tw_home: "{{ ansible_facts['env']['HOME'] }}"
tw_user: "{{ ansible_facts['user_id'] }}"
tw_python_version: "3.11"                         # matches the M4's CrisperWhisper venv (3.11.14)
tw_venv: "{{ tw_home }}/.venvs/flitools-crisper"  # FliTools' preferred path (docs/architecture.md)
tw_flitools_dir: "{{ tw_home }}/dev/ad/flivideo/flitools"

# --- FliTools service ----------------------------------------------------------
# LaunchDaemon (not LaunchAgent): it starts at boot with nobody logged in.
tw_flitools_enabled: true
tw_flitools_repo: git@github.com:flivideo/flitools.git
tw_flitools_version: main
tw_flitools_label: com.appydave.flitools
tw_crisper_min_free_gb: 14            # FLITOOLS_CRISPER_MIN_FREE_GB — the model peaks at ~13 GB
tw_min_memory_gb_warn: 24             # below this, the memory gate may never let a job start

# --- Formulae ------------------------------------------------------------------
tw_formulae:
  - ffmpeg
  - uv
  - node                              # FliTools' run.sh finds node on /opt/homebrew/bin (needs >= 20.19)

# --- Tailscale -----------------------------------------------------------------
# Default: keep Tailscale.app like the M4 and Roamy. The open-source daemon (starts
# before login) only helps without FileVault — with FileVault on, a rebooted Mac waits
# at the unlock screen and nothing runs until someone types the password anyway.
tw_tailscale_daemon: false

# --- Power / updates -----------------------------------------------------------
# Sleep, wake and power-failure restart belong to the power role (always_on group).
tw_disable_auto_macos_updates: true   # no surprise restarts for macOS updates (downloads still allowed)

# --- Thai / staff cleanup — OFF until David approves the list ------------------
tw_remove_thai_settings: false
tw_locale: en_AU
tw_languages: [en-AU]
tw_timezone: ""                       # e.g. "Asia/Bangkok" — empty = leave as is (David to decide)
tw_remove_user_accounts: []           # exact short names, filled in only after David approves
