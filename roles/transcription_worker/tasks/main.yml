---
# =============================================================================
# transcription_worker — see defaults/main.yml for the contract.
# Run via transcription-worker.yml (targeted) rather than site.yml.
# =============================================================================

# --- Preflight ---------------------------------------------------------------

- name: Warn if the worker has too little memory for CrisperWhisper
  ansible.builtin.debug:
    msg: >-
      ⚠️ {{ inventory_hostname }} has {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB RAM.
      CrisperWhisper peaks at ~13 GB and FliTools waits for {{ tw_crisper_min_free_gb }} GB free —
      on this box jobs may wait forever. Lower tw_crisper_min_free_gb only after a measured run.
  when: (ansible_facts['memtotal_mb'] / 1024) < tw_min_memory_gb_warn

# --- Packages ----------------------------------------------------------------

- name: Install worker formulae
  community.general.homebrew:
    name: "{{ tw_formulae }}"
    state: present
    path: "{{ homebrew_path }}"

# --- Tailscale as a system daemon (starts before login) ------------------------

- name: Check for the Tailscale GUI app (conflicts with tailscaled)
  ansible.builtin.stat:
    path: /Applications/Tailscale.app
  register: tw_tailscale_app
  when: tw_tailscale_daemon | bool

- name: Install the open-source Tailscale formula
  community.general.homebrew:
    name: tailscale
    state: present
    path: "{{ homebrew_path }}"
  when: tw_tailscale_daemon | bool

- name: Stop if the Tailscale app is installed
  when: tw_tailscale_daemon | bool and tw_tailscale_app.stat.exists
  ansible.builtin.fail:
    msg: |
      /Applications/Tailscale.app is installed on {{ inventory_hostname }}. The app and the
      open-source tailscaled cannot both run. Do this AT THE MACHINE or over LAN Screen Sharing
      (removing it drops the Tailscale link Ansible may be using):
        1. Quit Tailscale, then: brew uninstall --cask tailscale-app   (or drag the app to the Bin)
        2. Point ansible_host for mac-mini-m2 at mac-mini-m2.local and re-run this playbook.
        3. sudo tailscale up   → open the printed URL → log in → new IP: tailscale ip -4
        4. Put the new IP back in inventory/hosts.yml

- name: Install tailscaled as a system LaunchDaemon
  ansible.builtin.command: "{{ homebrew_path }}/tailscaled install-system-daemon"
  args:
    creates: /Library/LaunchDaemons/com.tailscale.tailscaled.plist
  become: true
  when: tw_tailscale_daemon | bool

# --- Power: sleep/wake/autorestart come from the power role; this adds the rest --

- name: Restart automatically if the system freezes
  ansible.builtin.command: systemsetup -setrestartfreeze on
  changed_when: false
  become: true

- name: Turn off automatic macOS update installs (no surprise restarts)
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.SoftwareUpdate
    key: AutomaticallyInstallMacOSUpdates
    type: bool
    value: false
  become: true
  when: tw_disable_auto_macos_updates | bool

# --- CrisperWhisper: standard install (uv venv + pinned requirements) ----------

- name: Ensure the venv parent directory exists
  ansible.builtin.file:
    path: "{{ tw_venv | dirname }}"
    state: directory
    mode: "0755"

- name: Create the CrisperWhisper venv (uv-managed Python {{ tw_python_version }})
  ansible.builtin.shell: |
    export PATH="{{ homebrew_path }}:$PATH"
    uv venv --python {{ tw_python_version }} "{{ tw_venv }}"
  args:
    creates: "{{ tw_venv }}/bin/python"
    executable: /bin/zsh

- name: Copy the pinned CrisperWhisper requirements into the venv
  ansible.builtin.copy:
    src: crisper-requirements.txt
    dest: "{{ tw_venv }}/requirements.txt"
    mode: "0644"

- name: Install CrisperWhisper packages (transformers fork from GitHub)
  ansible.builtin.shell: |
    export PATH="{{ homebrew_path }}:$PATH"
    uv pip install --python "{{ tw_venv }}/bin/python" -r "{{ tw_venv }}/requirements.txt" 2>&1
  args:
    executable: /bin/zsh
  register: tw_pip
  changed_when: "'Installed' in tw_pip.stdout"   # uv is idempotent: no-op when already satisfied

# The ~3.1 GB model (nyrahealth/CrisperWhisper) downloads to ~/.cache/huggingface on
# FliTools' first CrisperWhisper job — no task needed.

# --- FliTools: git clone + npm ci, run as a LaunchDaemon ----------------------

- name: Ensure the FliTools parent directory exists
  ansible.builtin.file:
    path: "{{ tw_flitools_dir | dirname }}"
    state: directory
    mode: "0755"
  when: tw_flitools_enabled | bool

- name: Clone FliTools
  ansible.builtin.git:
    repo: "{{ tw_flitools_repo }}"
    dest: "{{ tw_flitools_dir }}"
    version: "{{ tw_flitools_version }}"
    update: false            # a working copy: pull by hand, never over local changes
    accept_hostkey: true
  register: tw_flitools_clone
  when: tw_flitools_enabled | bool

- name: Install FliTools dependencies
  ansible.builtin.command: "{{ homebrew_path }}/npm ci"
  args:
    chdir: "{{ tw_flitools_dir }}"
    creates: "{{ tw_flitools_dir }}/node_modules"
  environment:
    PATH: "{{ homebrew_path }}:/usr/bin:/bin"
  notify: Restart FliTools
  when:
    - tw_flitools_enabled | bool
    - not (ansible_check_mode and tw_flitools_clone is changed)   # --check doesn't really clone

- name: Ensure FliTools log directory exists
  ansible.builtin.file:
    path: "{{ tw_home }}/Library/Logs/flitools"
    state: directory
    mode: "0755"
  when: tw_flitools_enabled | bool

- name: Install FliTools LaunchDaemon
  ansible.builtin.template:
    src: flitools.plist.j2
    dest: "/Library/LaunchDaemons/{{ tw_flitools_label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart FliTools
  when: tw_flitools_enabled | bool

- name: Check whether FliTools is loaded
  ansible.builtin.command: "launchctl print system/{{ tw_flitools_label }}"
  register: tw_flitools_loaded
  changed_when: false
  failed_when: false
  become: true
  when: tw_flitools_enabled | bool

- name: Load FliTools
  ansible.builtin.command: "launchctl bootstrap system /Library/LaunchDaemons/{{ tw_flitools_label }}.plist"
  become: true
  when:
    - tw_flitools_enabled | bool
    - tw_flitools_loaded.rc != 0

# --- Thai settings + staff accounts (report always; change only when approved) --

- name: Locale and account cleanup
  ansible.builtin.include_tasks: locale_cleanup.yml
